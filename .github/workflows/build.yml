name: Build Packages

on:
  push:
    branches: ["main"]
    paths:
      - "packages/**"
      - "packages.lock"
      - "repository.toml"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified artifacts to production
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  NFPM_VERSION: "2.41.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses:   actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - uses:   actions/setup-python@v6.2.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install deps
        run: pip install toml requests pyyaml

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate matrix
        id: set-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MATRIX=$(python scripts/manager.py matrix)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    container: ${{ matrix.build_image }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    if: needs.matrix.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - uses:   actions/checkout@v6.0.2
        with:
          filter: blob:none
          persist-credentials: false

      - name: Install package build dependencies
        if: matrix.depends && matrix.depends.build
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates curl git jq \
            python3 python3-toml python3-yaml
          DEPS=$(echo '${{ toJson(matrix.depends.build) }}' | jq -r '.[]' | tr '\n' ' ')
          if [ -n "$DEPS" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y $DEPS
          fi

      - name: Prepare source
        env:
          REPOSITORY: ${{ matrix.repo }}
          SOURCE_REF: ${{ matrix.version }}
        run: scripts/clone_source.sh

      - name: Setup Rust toolchain
        if: matrix.type == 'cargo' || matrix.toolchain != ''
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain || 'stable' }}

      - name: Cache Rust dependencies
        if: matrix.type == 'cargo' || matrix.toolchain != ''
        uses:   Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: "rust-${{ matrix.name }}"
          workspaces: "src -> target"
          cache-on-failure: true

      - name: Cache build dependencies
        if: matrix.cache
        uses:   actions/cache@v5.0.5
        with:
          path: ${{ join(fromJson(toJson(matrix.cache.paths)), '\n') }}
          key: ${{ matrix.build_image }}-${{ runner.arch }}-${{ matrix.cache.key }}-${{ hashFiles(format('packages/{0}/**', matrix.name)) }}

      - name: Install cargo-binstall
        if: matrix.type == 'cargo'
        uses:   cargo-bins/cargo-binstall@v1.19.1

      - name: Install cargo-deb
        if: matrix.type == 'cargo'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo binstall cargo-deb -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache nfpm
        if: matrix.type != 'cargo'
        id: cache-nfpm
        uses:   actions/cache@v5.0.5
        with:
          path: /usr/local/bin/nfpm
          key: nfpm-${{ matrix.build_image }}-${{ env.NFPM_VERSION }}

      - name: Install nfpm
        if: matrix.type != 'cargo' && steps.cache-nfpm.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" \
            -o /tmp/nfpm.deb
          dpkg -i /tmp/nfpm.deb


      - name: Build ${{ matrix.name }}
        env:
          APP_VERSION: ${{ matrix.version }}
          POST_BUILD:  ${{ matrix.post_build }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p dist

          case "${{ matrix.type }}" in

            cargo)
              cd src
              cargo deb
              cd ..
              ;;

            make)
              cd src
              source "$HOME/.cargo/env" 2>/dev/null || true
              export PATH="$HOME/.cargo/bin:$PATH"
              ${{ matrix.build_cmd }}
              cd ..
              ;;

            custom)
              cd src
              ${{ matrix.build_cmd }}
              [[ -n "$POST_BUILD" ]] && eval "$POST_BUILD"
              cd ..
              ;;

            ninja)
              cd src
              meson setup build --prefix=/usr --buildtype=release
              ninja -C build
              cd ..
              ;;

          esac

      - name: Collect cargo-deb output
        if: matrix.type == 'cargo'
        run: |
          mkdir -p dist
          if ls src/target/debian/*.deb 2>/dev/null; then
            cp src/target/debian/*.deb dist/
          else
            echo "❌ cargo-deb output not found"
            exit 1
          fi

      - name: Generate nfpm config & package
        if: matrix.type != 'cargo'
        run: |
          python3 scripts/manager.py nfpm-config \
            --package "${{ matrix.name }}" \
            --src-dir src \
            --output /tmp/nfpm.yaml

          echo "--- nfpm.yaml ---"
          cat /tmp/nfpm.yaml

          mkdir -p dist
          nfpm package \
            --config /tmp/nfpm.yaml \
            --packager deb \
            --target dist/

          echo "✅ $(ls -lh dist/*.deb)"

      - uses:   actions/upload-artifact@v7.0.1
        with:
          name: deb-${{ matrix.name }}
          path: dist/*.deb
          retention-days: 7

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      repository: ${{ steps.verify.outputs.repository }}
      distribution: ${{ steps.verify.outputs.distribution }}
      component: ${{ steps.verify.outputs.component }}
      architecture: ${{ steps.verify.outputs.architecture }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          filter: blob:none

      - name: Download candidate artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: deb-*
          path: candidate-debs
          merge-multiple: true

      - name: Verify complete package set
        id: verify
        run: |
          python3 scripts/verify_artifacts.py \
            --artifacts candidate-debs \
            --publish-set verified-debs

      - name: Upload verified package set
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-debs
          path: verified-debs/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          filter: blob:none

      - name: Download verified .deb artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: verified-debs
          path: all-debs

      - name: Setup aptly
        run: |
          APTLY_VERSION="1.5.0"
          wget -q "https://github.com/aptly-dev/aptly/releases/download/v${APTLY_VERSION}/aptly_${APTLY_VERSION}_linux_amd64.tar.gz" \
            -O /tmp/aptly.tar.gz
          sudo tar -xzf /tmp/aptly.tar.gz -C /usr/local/bin \
            --strip-components=1 \
          aptly_${APTLY_VERSION}_linux_amd64/aptly

      - name: Configure GPG
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'pinentry-mode loopback\nbatch\n' > ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\n'       > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import

      - name: Publish to Cloudflare R2
        env:
          GPG_PASSPHRASE:       ${{ secrets.GPG_PASSPHRASE }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          REPOSITORY:           ${{ needs.verify.outputs.repository }}
          DISTRIBUTION:         ${{ needs.verify.outputs.distribution }}
          COMPONENT:            ${{ needs.verify.outputs.component }}
          ARCHITECTURE:         ${{ needs.verify.outputs.architecture }}
        run: |
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG \
                   | grep sec | awk '{print $2}' | cut -d/ -f2 | head -n1)

          cat > ~/.aptly.conf <<JSON
          {
            "rootDir": "$HOME/.aptly",
            "downloadConcurrency": 4,
            "S3PublishEndpoints": {
              "r2": {
                "region":             "auto",
                "bucket":             "${R2_BUCKET}",
                "endpoint":           "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com",
                "awsAccessKeyID":     "${R2_ACCESS_KEY_ID}",
                "awsSecretAccessKey": "${R2_SECRET_ACCESS_KEY}",
                "plusWorkaround":     true,
                "forceSigV2":         false,
                "disableMultiDel":    false
              }
            }
          }
          JSON

          aptly repo create \
            -distribution="$DISTRIBUTION" \
            -component="$COMPONENT" \
            "$REPOSITORY"

          find all-debs -name "*.deb" -exec aptly repo add -force-replace "$REPOSITORY" {} +

          echo "📦 Packages to publish:"
          aptly repo show -with-packages "$REPOSITORY"

          aptly publish repo \
            -force-overwrite \
            -distribution="$DISTRIBUTION" \
            -architectures="$ARCHITECTURE" \
            -gpg-key="$KEY_ID" \
            -passphrase="$GPG_PASSPHRASE" \
            "$REPOSITORY" s3:r2:

          gpg --export --armor "$KEY_ID" > pubkey.gpg

          curl -X PUT \
            "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}/pubkey.gpg" \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
            -H "Content-Type: application/pgp-keys" \
            --data-binary @pubkey.gpg

          echo "✅ Published to R2 successfully!"

  cleanup:
    needs: [matrix, build, verify, publish]
    if: always() && needs.publish.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses:   actions/github-script@v9.0.0
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure'
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: '✅ CI passed. Auto-closing.'
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed'
              });
            }

  report:
    needs: [matrix, build, verify, publish]
    if: always() && (needs.matrix.result == 'failure' || needs.build.result == 'failure' || needs.verify.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          filter: blob:none
          fetch-depth: 2
          persist-credentials: false

      - name: Ensure labels exist
        uses:   actions/github-script@v9.0.0
        with:
          script: |
            const needed = [
              { name: 'ci-failure',    color: 'd73a4a' },
              { name: 'error:build-dep', color: 'fbca04' },
              { name: 'error:compile',   color: 'fbca04' },
              { name: 'error:test',      color: 'fbca04' },
              { name: 'error:network',   color: 'fbca04' },
              { name: 'error:oom',       color: 'fbca04' },
              { name: 'error:timeout',   color: 'fbca04' },
              { name: 'error:unknown',   color: 'fbca04' },
              { name: 'severity:critical', color: 'b60205' },
              { name: 'severity:high',    color: 'd93f0b' },
              { name: 'severity:medium',  color: 'e4e669' },
            ];
            for (const label of needed) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
              } catch {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }

      - name: Create issue on failure + AI analysis
        uses:   actions/github-script@v9.0.0
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_URL: ${{ vars.AI_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const report = require('./scripts/ci-report.js');
            await report(github, context, core);
