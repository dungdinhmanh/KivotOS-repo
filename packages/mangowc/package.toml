name = "mangowc"
repo = "github:mangowm/mango"
version = "latest"
type = "custom"
build = "bash ../packages/mangowc/build.sh"
binary = "mangowc"
description = "A Wayland compositor based on wlroots and scenefx (dwm but wayland)"
license = "MIT"
homepage = "https://github.com/mangowm/mango"

[depends]
build = [
    "git",
    "meson",
    "ninja-build",
    "pkg-config",
    "cmake",
    "bison",
    "libxml2-dev",
    "libffi-dev",
    "libegl-dev",
    "libgles2-mesa-dev",
    "libgbm-dev",
    "libwayland-dev",
    "wayland-protocols",
    "libdrm-dev",
    "libxkbcommon-dev",
    "libpixman-1-dev",
    "libdisplay-info-dev",
    "libliftoff-dev",
    "hwdata",
    "libseat-dev",
    "libpcre2-dev",
    "xwayland",
    "libxcb1-dev",
    "libxcb-composite0-dev",
    "libxcb-ewmh-dev",
    "libxcb-icccm4-dev",
    "libxcb-res0-dev",
    "libc6-dev",
    "libudev-dev",
    "libmtdev-dev",
    "libevdev-dev",
    "libinput-dev",
    "libcjson-dev",
    "libpango1.0-dev"
]
runtime = [
    "libdrm2",
    "libxkbcommon0",
    "libpixman-1-0",
    "libdisplay-info2",
    "libliftoff0",
    "libseat1",
    "libinput10",
    "libudev1",
    "libffi8",
    "libgbm1",
    "libegl1",
    "libgles2",
    "libpcre2-8-0",
    "libcjson1",
    "libpangocairo-1.0-0",
    "libpango-1.0-0",
    "libcairo2",
    "libxcb1",
    "libxcb-composite0",
    "libxcb-ewmh2",
    "libxcb-icccm4",
    "libxcb-render0",
    "libxcb-res0",
    "libxcb-xfixes0",
    "hwdata",
    "xwayland"
]
optional = []

[distro]
codenames = ["trixie"]
arch = "amd64"

[control]
maintainer = "Dinh Manh Dung <dungdinhmanh0209@gmail.com>"
section = "x11"
priority = "optional"
homepage = "https://github.com/mangowm/mango"

[install]
"package-root/usr/bin/mango" = "/usr/bin/mangowc"
"package-root/usr/bin/mmsg" = "/usr/bin/mmsg"
"package-root/usr/share/wayland-sessions/mango.desktop" = "/usr/share/wayland-sessions/mango.desktop"
"package-root/usr/share/xdg-desktop-portal/mango-portals.conf" = "/usr/share/xdg-desktop-portal/mango-portals.conf"
"package-root/etc/mango/config.conf" = "/etc/mango/config.conf"
"package-root/usr/share/man/man1/mmsg.1" = "/usr/share/man/man1/mmsg.1"
"package-root/usr/lib/x86_64-linux-gnu/libwlroots-0.20.so" = "/usr/lib/x86_64-linux-gnu/libwlroots-0.20.so"
"package-root/usr/lib/x86_64-linux-gnu/libscenefx-0.5.so" = "/usr/lib/x86_64-linux-gnu/libscenefx-0.5.so"

[cache]
paths = ["build/local", "build/deps"]
key = "mangowc-deps-v2"
